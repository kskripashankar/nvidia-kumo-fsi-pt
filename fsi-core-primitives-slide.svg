      <text x="14" y="19" class="layer-txt" fill="#BEF264">🟢 <tspan font-weight="800" fill="#DCFCE7">Layer 1: Accelerated Compute</tspan> — NVLink-Aware Unified Dynamic Subgraph Memory Cache (Multi-GPU HBM memory fabric eliminating host-to-device PCIe bandwidth stalls).</text>
