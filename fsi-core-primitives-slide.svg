      .kpi-value { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 25px; font-weight: 800; }
      .kpi-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; fill: #CBD5E1; }

      .section-hdr { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
